name: sheets
version: "0.1.0"
description: "An agentic spreadsheet. Ask for a sheet and a Hermes agent finds the rows on the web, each with its source, or bring your own. Hermes suggests typed columns, fills only the ones you pick, explains what the answers add up to, and lets any chat read your grids and propose cells, columns and rows that you approve and can undo."
author: Adolanium
license: MIT
homepage: https://github.com/Adolanium/hermes-sheets
manifest_version: 1
kind: standalone
requires_hermes: ">=0.22.6"

provides_tools:
  - sheets_list     # the person's grids (tools.py)
  - sheets_read     # rows and columns of one grid
  - sheets_propose  # cell changes, new columns and rows, waiting for review in Sheets
  - sheets_create   # a new grid from data the agent gathered
provides_hooks: []
provides_middleware: []
requires_env: []
